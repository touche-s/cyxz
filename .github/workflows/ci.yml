name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test (cyxz-post)
        run: mvn test -pl cyxz-post,cyxz-common -am -B

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cyxz-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: cyxz-frontend

      - name: Run tests
        run: npm test
        working-directory: cyxz-frontend

      - name: Build
        run: npm run build
        working-directory: cyxz-frontend
