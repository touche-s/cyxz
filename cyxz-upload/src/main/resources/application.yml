server:
  port: 9006

spring:
  application:
    name: cyxz-upload
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
      config:
        server-addr: ${NACOS_SERVER_ADDR}
        file-extension: yml
  config:
    import:
      - optional:nacos:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET_NAME:cyxz}
