server:
  port: 9006

spring:
  application:
    name: cyxz-upload
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        file-extension: yml
  config:
    import:
      - "optional:nacos:${spring.application.name}.yml"
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET_NAME:cyxz}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  default-flat-param-object: true

knife4j:
  enable: true
  setting:
    language: zh_cn
