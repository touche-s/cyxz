server:
  port: 8080

spring:
  application:
    name: cyxz-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        file-extension: yml
  config:
    import:
      - optional:nacos:

# JWT 配置
jwt:
  secret: ${JWT_SECRET:default-secret-key-at-least-32-chars}
  expiration: ${JWT_EXPIRATION:86400}
